name: V3 Daily Signal

on:
  schedule:
    # Taiwan time 14:30 = UTC 06:30, after market close.
    - cron: "30 6 * * 1-5"
  workflow_dispatch:

jobs:
  # 準時觸發改由 cron-job.org 呼叫 workflow_dispatch；GitHub 自己的 schedule 常延遲數小時，
  # 只當備援：12 小時內已有成功（或執行中）的手動/外部觸發就跳過，避免重複推播
  guard:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            n=$(gh run list -R "$GITHUB_REPOSITORY" -w "$GITHUB_WORKFLOW" -e workflow_dispatch -L 20 \
              --json createdAt,conclusion \
              -q '[.[] | select((.createdAt | fromdateiso8601) > (now - 43200)) | select(.conclusion != "failure" and .conclusion != "cancelled")] | length')
            [ "${n:-0}" -gt 0 ] && skip=true
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "event=${{ github.event_name }} skip=$skip"

  run-signal:
    needs: guard
    if: needs.guard.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: uv sync

      - name: Run signal engine
        env:
          FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          LINE_CHANNEL_TOKEN: ${{ secrets.LINE_CHANNEL_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_CREDS_JSON: ${{ secrets.GOOGLE_CREDS_JSON }}
        run: uv run python main.py
